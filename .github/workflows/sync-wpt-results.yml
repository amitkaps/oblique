name: Sync WPT results

on:
  schedule:
    # Daily, 06:00 UTC — wpt.fyi's own stable runs land continuously, daily
    # is frequent enough to keep the dashboard current without hammering
    # their API.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - uses: pnpm/action-setup@v4
        with:
          version: "12.4.2"

      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: "pnpm"
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Sync results from wpt.fyi
        run: uv run scripts/sync-wpt-results.py

      - name: Render coverage docs + dashboard data
        run: uv run scripts/render-coverage-docs.py

      - name: Generate site data + HTML (site/index.html)
        run: uv run scripts/generate-site-data.py

      - name: Build static site
        working-directory: site
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Deploy built site into docs/ (GitHub Pages root)
        run: |
          rm -rf docs/assets
          cp -r site/dist/* docs/

      - name: Commit refreshed data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/coverage.md results/upstream.json results/upstream-matrix.md docs/data/ docs/index.html docs/assets/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Sync WPT results from wpt.fyi [skip ci]"
            git push
          fi

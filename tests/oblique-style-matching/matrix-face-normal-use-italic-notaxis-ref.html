<!DOCTYPE html>
<html lang="en" class="reftest-wait">
<meta charset="utf-8" />
<title>CSS Test: @font-face { font-style: normal } + font-style: italic (must not render as a face-matched slant) (reference)</title>
<!--
  Reference: the same face with the real axis set directly to slnt -11.
-->
<link rel="stylesheet" href="oblique-matching.css">
<style>
  @font-face {
    font-family: "matrix test font";
    src: url('resources/Cairo.var.subset.ttf');
    font-style: normal;
  }
  .test {
    font-family: "matrix test font";
    font-size: 8em;
    font-variation-settings: 'slnt' -11;
  }
</style>
<script>
  document.fonts.ready.then(() => {
    document.documentElement.classList.remove('reftest-wait');
  });
</script>

<p class="test">I</p>

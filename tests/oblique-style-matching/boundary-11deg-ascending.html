<!DOCTYPE html>
<html lang="en" class="reftest-wait">
<meta charset="utf-8" />
<title>CSS Test: explicit `oblique 11deg` at the +11deg branch boundary sets `slnt` with the correct sign</title>
<!--
  Algorithm step: CSS Fonts 4 §5.2 "Matching font styles" — the oblique
  sub-algorithm branches on the requested angle at exactly 11deg ("If the
  value of font-style is oblique and the requested angle is greater than or
  equal to 11deg, ..."). At this exact boundary, against a variable font
  whose own (auto-derived) slnt range directly includes the requested value,
  "For variable fonts with a slnt axis, a match is created by setting the
  slnt value with the specified oblique value."
  Prior art: WebKit #209565 (STILL OPEN, see docs/investigation-log.md)
  documents mishandling of SIGNED angles specifically. This is the positive
  half of a sign-symmetry pair with boundary-11deg-descending.html (which
  requests -11deg against the same font) — together they check that the
  browser doesn't, say, apply the same slnt sign regardless of the
  requested angle's sign, or silently drop the sign at the branch boundary.
  Pass means: the "oblique 11deg" paragraph renders identically to the
  reference, which sets 'slnt' to -11 directly via font-variation-settings
  (the CSS-oblique-angle-to-OpenType-slnt sign convention already confirmed
  in this project: positive CSS angle maps to negative slnt — see
  auto-derived-range-clamp.html's font comment, and this suite's own
  resources/build-fonts.py).
-->
<link rel="help" href="https://drafts.csswg.org/css-fonts-4/#font-style-matching" />
<link rel="help" href="https://bugs.webkit.org/show_bug.cgi?id=209565" />
<link rel="match" href="boundary-11deg-ascending-ref.html">
<meta name="assert"
  content="'font-style: oblique 11deg', requested at the exact +11deg branch
  boundary against a variable font whose auto-derived slnt range directly
  includes it, sets 'slnt' to -11 (this suite's established sign
  convention) — not the unsigned magnitude, not 0, and not the opposite
  sign." />
<link rel="stylesheet" href="oblique-matching.css">
<!--
  Font: resources/Cairo.var.subset.ttf (real Cairo subset to "OBLIQUE",
  slnt range -11..11, see README.md); the test glyph is the capital I. No
  font-style descriptor declared (auto), so the whole range is directly
  usable without a distance search — this test is about sign correctness
  at the boundary, not the multi-step fallback search itself (see
  multi-branch-fallback-chain.html for that).
-->
<style>
  @font-face {
    font-family: "boundary test font";
    src: url('resources/Cairo.var.subset.ttf');
  }
  .test {
    font-synthesis: none;
    font-family: "boundary test font";
    font-size: 8em;
  }
</style>
<script>
  document.fonts.ready.then(() => {
    document.documentElement.classList.remove('reftest-wait');
  });
</script>

<p class="test" style="font-style: oblique 11deg">I</p>

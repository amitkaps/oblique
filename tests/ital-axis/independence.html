<!DOCTYPE html>
<html lang="en" class="reftest-wait">
<meta charset="utf-8" />
<title>CSS Test: `oblique` does not activate a variable font's `ital` axis</title>
<!--
  Algorithm step: CSS Fonts 4 §5.2 "Matching font styles" — per the
  resolution of csswg-drafts#12836 (merged into the published spec
  2026-08-31, verified in docs/findings.md): "The ital axis is not used to
  satisfy an oblique request." Only `italic` requests set a variable font's
  `ital` axis to 1; `oblique` requests must leave it untouched.
  Prior art: csswg-drafts#12836 (resolved), WebKit #209565 (open — documents
  ital/oblique cross-talk as exactly this class of bug, though for the
  opposite direction: italic incorrectly touching slant).
  Scope note: this test forces font-synthesis:none, so it can only tell
  "ital wasn't touched" apart from "synthesis was suppressed regardless" —
  it does NOT probe whether font-style:italic against this same font would
  stack spurious synthetic slant on top of a real ital=1 match. See the
  companion test italic-no-extra-synthesis.html for that (WebKit #209565's
  specific documented ital-axis failure mode; it FAILS on Chrome 153 as of
  2026-09-18 — see docs/findings.md).
  Pass means: the "oblique" paragraph renders identically to a plain
  upright rendering with no ital-axis shear — proving font-style: oblique,
  applied to a font whose only face has no dedicated oblique/italic face
  and exposes only an `ital` axis (no `slnt`), did not activate that axis.
-->
<link rel="help" href="https://drafts.csswg.org/css-fonts-4/#font-style-matching" />
<link rel="help" href="https://github.com/w3c/csswg-drafts/issues/12836" />
<link rel="match" href="independence-ref.html">
<meta name="assert"
  content="A font exposing only a variable 'ital' axis (no 'slnt') must not
  have that axis activated by a 'font-style: oblique' request — only
  'italic' requests may set ital=1." />
<!--
  Font: resources/IdentTestItal.ttf — purpose-built (see
  tests/ital-axis/README.md for why no existing WPT font could make this
  assertion deterministic). Single glyph 'A': a rectangle at ital=0, sheared
  into a parallelogram at ital=1. No font-style descriptor is declared on
  the @font-face, so the UA's own style-matching fallback determines which
  face satisfies each request; the assertion is specifically about whether
  that fallback triggers the ital axis, not about explicit face selection.
-->
<style>
  @font-face {
    font-family: "ital axis test";
    src: url('resources/IdentTestItal.ttf');
  }

  .test {
    font-family: "ital axis test";
    font-size: 3em;
  }

  .oblique {
    font-style: oblique;
    font-synthesis: none;
  }
</style>
<script>
  document.fonts.ready.then(() => {
    document.documentElement.classList.remove('reftest-wait');
  });
</script>

<p class="test oblique">A</p>

<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<title>CSS Test: font-style: oblique -11deg 11deg + font-style: oblique; font-synthesis: none;</title>
<!--
  @font-face font-style: oblique -11deg 11deg, request "oblique". The reference algorithm permits: slnt -11.
  selected face face (stage: oblique 14: nearest oblique (above ascending, then below descending))
  oblique face [-11, 11]: closest matching value 11, clamped to the descriptor, then to the font
  no synthesis: font-synthesis-style: none forbids synthesis
  The request also sets font-synthesis: none;
-->
<link rel="help" href="https://drafts.csswg.org/css-fonts-4/#font-style-matching">
<link rel="help" href="https://drafts.csswg.org/css-fonts-4/#font-synthesis-style">
<link rel="match" href="font-style-match-slnt-11-ref.html">
<meta name="assert"
  content="A face declared 'font-style: oblique -11deg 11deg', requested with 'font-style: oblique; font-synthesis: none;', must render like one of: slnt -11.">
<link rel="stylesheet" href="font-style-match.css">
<style>
  @font-face {
    font-family: "Cairo Var OBLIQUE";
    src: url('resources/Cairo.var.subset.ttf');
    font-style: oblique -11deg 11deg;
  }
  .test {
    font-family: "Cairo Var OBLIQUE";
    font-size: 8em;
  }
</style>

<p class="test" style="font-style: oblique; font-synthesis: none;">I</p>

<!DOCTYPE html>
<html lang="en" class="reftest-wait">
<meta charset="utf-8" />
<title>CSS Test: `italic` against a variable `ital` axis face must not stack synthetic slant on top</title>
<!--
  Algorithm step: CSS Fonts 4 §5.2 "Matching font styles" + the general
  matching rule that once a face satisfies a style request, the UA must not
  additionally synthesize for it. Per the resolution of csswg-drafts#12836
  (merged 2026-08-31, verified in docs/findings.md): "For variable fonts
  with an ital axis, a match is created by setting the ital value to 1" —
  that match is real, so nothing should be layered on top of it.
  Prior art: WebKit #209565's SPECIFIC documented failure for ital-axis
  fonts (not the oblique/slnt direction independence.html
  already covers): "for fonts with an ital axis, font-style:italic
  activates the axis but ALSO applies a spurious 20 degrees of synthesized
  slant on top." This test targets exactly that failure mode, which
  independence.html's font-synthesis:none does not probe (that forces
  synthesis off entirely, so it can't tell "no synthesis needed" apart from
  "synthesis suppressed" — a gap flagged in review). font-synthesis is
  deliberately left at its default (auto) here so any spurious synthesis is
  free to happen if the engine has this bug.
  Pass means: the "italic" paragraph renders identically to a reference
  that sets 'ital' 1 explicitly via font-variation-settings with no
  font-style matching involved at all — i.e. italic activated the real
  ital=1 match and stacked nothing extra on top of it.
-->
<link rel="help" href="https://drafts.csswg.org/css-fonts-4/#font-style-matching" />
<link rel="help" href="https://bugs.webkit.org/show_bug.cgi?id=209565" />
<link rel="help" href="https://github.com/w3c/csswg-drafts/issues/12836" />
<link rel="match" href="italic-no-extra-synthesis-ref.html">
<meta name="assert"
  content="A 'font-style: italic' request against a face whose only style
  axis is a variable 'ital' axis must set ital=1 and synthesize nothing
  further — the real axis match satisfies the request." />
<!--
  Font: resources/IdentTestItal.ttf, same purpose-built font as
  independence.html (see README.md). Any spurious
  synthetic slant stacked on top of the font's own ital=1 shear would
  visibly over-shear the glyph relative to the reference, which is
  deterministic and pixel-distinguishable per this font's design.
-->
<style>
  @font-face {
    font-family: "ital axis test";
    src: url('../resources/IdentTestItal.ttf');
  }

  .test {
    font-family: "ital axis test";
    font-size: 3em;
  }

  .italic {
    font-style: italic;
  }
</style>
<script>
  document.fonts.ready.then(() => {
    document.documentElement.classList.remove('reftest-wait');
  });
</script>

<p class="test italic">A</p>

<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<title>CSS Reference: slnt -11</title>
<!--
  A plain face with the axis pinned through font-variation-settings, which wins over any
  style-derived variation (CSS Fonts 4 7.2), so this does not depend on the font-style
  descriptor or on the matching that the tests exercise.
-->
<link rel="stylesheet" href="font-style-match.css">
<style>
  @font-face {
    font-family: "Cairo Var OBLIQUE";
    src: url('resources/Cairo.var.subset.ttf');
  }
  .test {
    font-family: "Cairo Var OBLIQUE";
    font-size: 8em;
    font-variation-settings: 'slnt' -11;
  }
</style>

<p class="test">I</p>

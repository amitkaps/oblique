<!DOCTYPE html>
<html lang="en" class="reftest-wait">
<meta charset="utf-8" />
<title>CSS Test: bare `oblique`/`italic` default angle clamps into an AUTO-DERIVED (undeclared) `slnt` range (reference)</title>
<!--
  Reference rendering: sets the slnt axis explicitly via
  font-variation-settings to this font's own extreme value (-10, its fvar
  minimum), bypassing automatic font-style matching entirely — the "known
  good" rendering the test's automatic-mapping path is checked against.
  Both bare 'oblique' and bare 'italic' are expected to clamp to this same
  boundary, since the font's auto-derived usable range (0..10 in CSS-angle
  terms) doesn't reach the UA's 14-degree default in either direction, and
  the face exposes no real 'ital' axis for 'italic' to resolve through
  separately (same convergence already observed and confirmed passing in
  slnt-axis-activation.html and upstream's
  font-slant-1.html).
-->
<style>
  @font-face {
    font-family: "auto range test font";
    src: url('resources/Inter.var.subset.ttf');
  }

  .test {
    font-family: "auto range test font";
    font-size: 3em;
    font-variation-settings: 'slnt' -10;
  }
</style>
<script>
  document.fonts.ready.then(() => {
    document.documentElement.classList.remove('reftest-wait');
  });
</script>

<p class="test">slant</p>
<p class="test">slant</p>

<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<title>CSS Test: no font-style descriptor (auto) + font-style: oblique; font-synthesis: none;</title>
<!--
  @font-face no font-style descriptor (auto), request "oblique". The reference algorithm permits: slnt -11.
  selected face face (stage: oblique 14: oblique <= 0 descending)
  auto face, oblique request, font with slnt: the axis is set to the requested angle, limited by the font only (5.2, 4.4)
  no synthesis: font-synthesis-style: none forbids synthesis
  The request also sets font-synthesis: none;
-->
<link rel="help" href="https://drafts.csswg.org/css-fonts-4/#font-style-matching">
<link rel="help" href="https://drafts.csswg.org/css-fonts-4/#font-synthesis-style">
<link rel="match" href="font-style-match-slnt-11-ref.html">
<meta name="assert"
  content="A face with no font-style descriptor (auto), requested with 'font-style: oblique; font-synthesis: none;', must render like one of: slnt -11.">
<link rel="stylesheet" href="font-style-match.css">
<style>
  @font-face {
    font-family: "Cairo Var OBLIQUE";
    src: url('resources/Cairo.var.subset.ttf');
  }
  .test {
    font-family: "Cairo Var OBLIQUE";
    font-size: 8em;
  }
</style>

<p class="test" style="font-style: oblique; font-synthesis: none;">I</p>

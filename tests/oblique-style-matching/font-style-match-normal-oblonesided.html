<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<title>CSS Test: font-style: oblique 0deg 10deg + font-style: normal;</title>
<!--
  @font-face font-style: oblique 0deg 10deg, request "normal". The reference algorithm permits: slnt 0.
  selected face face (stage: normal: oblique >= 0 ascending)
  oblique face [0, 10]: closest matching value 0, clamped to the descriptor, then to the font
  font-synthesis is left at its default: a matched request must not be synthesized.
-->
<link rel="help" href="https://drafts.csswg.org/css-fonts-4/#font-style-matching">
<link rel="help" href="https://drafts.csswg.org/css-fonts-4/#font-synthesis-style">
<link rel="match" href="font-style-match-slnt0-ref.html">
<meta name="assert"
  content="A face declared 'font-style: oblique 0deg 10deg', requested with 'font-style: normal;', must render like one of: slnt 0.">
<link rel="stylesheet" href="font-style-match.css">
<style>
  @font-face {
    font-family: "Cairo Var OBLIQUE";
    src: url('resources/Cairo.var.subset.ttf');
    font-style: oblique 0deg 10deg;
  }
  .test {
    font-family: "Cairo Var OBLIQUE";
    font-size: 8em;
  }
</style>

<p class="test" style="font-style: normal;">I</p>

<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<title>CSS Test: no font-style descriptor (auto) + font-style: oblique 5deg;</title>
<!--
  @font-face no font-style descriptor (auto), request "oblique 5deg". The reference algorithm permits: slnt -5.
  selected face face (stage: oblique 5: oblique <= 0 descending)
  auto face, oblique request, font with slnt: the axis is set to the requested angle, limited by the font only (5.2, 4.4)
  no synthesis: an auto face on a font with a slnt axis is matched by the axis; shearing is only the fallback (5.2)
  font-synthesis is left at its default: a matched request must not be synthesized.
-->
<link rel="help" href="https://drafts.csswg.org/css-fonts-4/#font-style-matching">
<link rel="help" href="https://drafts.csswg.org/css-fonts-4/#font-synthesis-style">
<link rel="match" href="font-style-match-slnt-5-ref.html">
<meta name="assert"
  content="A face with no font-style descriptor (auto), requested with 'font-style: oblique 5deg;', must render like one of: slnt -5.">
<link rel="stylesheet" href="font-style-match.css">
<style>
  @font-face {
    font-family: "Cairo Var OBLIQUE";
    src: url('resources/Cairo.var.subset.ttf');
  }
  .test {
    font-family: "Cairo Var OBLIQUE";
    font-size: 8em;
  }
</style>

<p class="test" style="font-style: oblique 5deg;">I</p>

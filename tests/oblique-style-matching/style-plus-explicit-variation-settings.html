<!DOCTYPE html>
<html lang="en" class="reftest-wait">
<meta charset="utf-8" />
<title>CSS Test: an explicit `font-variation-settings: 'slnt'` value overrides `font-style`'s implied slnt</title>
<!--
  Algorithm step: CSS Fonts 4 §7.2 "Feature and variation precedence" —
  "General and font specific font feature property settings are resolved
  in the order below, in ascending order of precedence." The ordered list
  places "Font variations as enabled by the font-weight, font-width, and
  font-style properties are applied" near the START of that list, and
  "Font variations implied by the value of the font-variation-settings
  property are applied" near the END — i.e. font-variation-settings (the
  property, applied to the element directly, not the @font-face
  descriptor) has HIGHER precedence and must win when the two conflict.
  Closes docs/coverage.json's confirmed_gaps entry
  'font-style-plus-explicit-axis-pairing': the spec's own recommended
  author pattern (pairing font-style with an explicit
  font-variation-settings override, e.g. for fallback-face compatibility)
  was previously untested for what happens when the two actually disagree.
  Pass means: the test paragraph — which sets both `font-style: oblique
  5deg` (which alone would imply slnt -5) AND a conflicting
  `font-variation-settings: 'slnt' -11` on the same rule — renders
  identically to the reference, which sets only 'slnt' -11. If font-style's
  implied value won instead, the test would render at slnt -5, visibly
  less sheared than the reference.
-->
<link rel="help" href="https://drafts.csswg.org/css-fonts-4/#feature-variation-precedence" />
<link rel="match" href="style-plus-explicit-variation-settings-ref.html">
<meta name="assert"
  content="When 'font-style' and an explicit 'font-variation-settings: 'slnt'
  <val>' on the same rule disagree about the slnt value, the explicit
  font-variation-settings value wins, per §7.2's precedence ordering." />
<link rel="stylesheet" href="oblique-matching.css">
<!-- Font: resources/Cairo.var.subset.ttf (auto, no descriptor) — see README.md. -->
<style>
  @font-face {
    font-family: "precedence test";
    src: url('resources/Cairo.var.subset.ttf');
  }
  .test {
    font-synthesis: none;
    font-family: "precedence test";
    font-size: 8em;
    font-style: oblique 5deg;
    font-variation-settings: "slnt" -11;
  }
</style>
<script>
  document.fonts.ready.then(() => {
    document.documentElement.classList.remove('reftest-wait');
  });
</script>

<p class="test">I</p>

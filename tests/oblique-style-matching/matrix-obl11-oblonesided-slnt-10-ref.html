<!DOCTYPE html>
<html lang="en" class="reftest-wait">
<meta charset="utf-8" />
<title>Reference for C4 (matrix-obl11-oblonesided): slnt -10</title>
<!--
  Reference for C4: slnt -10. The test must render like this. A plain face
  with the axis pinned through font-variation-settings (which wins over any style-derived
  variation, CSS Fonts 4 7.2), so this reference does not depend on the descriptor or on the
  matching under test.
-->
<link rel="stylesheet" href="oblique-matching.css">
<style>
  @font-face {
    font-family: "matrix test font";
    src: url('resources/Cairo.var.subset.ttf');
  }
  .test {
    font-family: "matrix test font";
    font-size: 8em;
    font-variation-settings: 'slnt' -10;
  }
</style>
<script>
  document.fonts.ready.then(() => {
    document.documentElement.classList.remove('reftest-wait');
  });
</script>

<p class="test">I</p>

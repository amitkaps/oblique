<!DOCTYPE html>
<html lang="en" class="reftest-wait">
<meta charset="utf-8" />
<title>CSS Test: no font-style descriptor (auto) + <em> (implicit italic via the UA stylesheet)</title>
<!--
  Coverage-matrix cell: @font-face descriptor = "no font-style descriptor (auto)", use-site CSS
  = "<em> (implicit italic via the UA stylesheet)". Part of a systematic 5-descriptor x 7-use-site
  enumeration built for this folder's font-shape x use-site coverage matrix
  (see ../../scripts/generate-site-data.py's MATRIX_FONT_SHAPES /
  MATRIX_USE_SITE_COLUMNS, and docs/investigation-log.md for the full
  session this batch was built in).
  em implies italic; auto-derived range consistently gets real-axis treatment (established by auto-derived-range-clamp*.html).
-->
<link rel="help" href="https://drafts.csswg.org/css-fonts-4/#font-style-matching" />
<link rel="help" href="https://drafts.csswg.org/css-fonts-4/#descdef-font-face-font-style" />
<link rel="match" href="matrix-auto-r5-auto-ref.html">
<meta name="assert"
  content="A face declared 'no font-style descriptor (auto)', requested with '<em> (implicit italic via the UA stylesheet)',
  must render the same as the reference, which sets 'slnt' -11 directly." />
<link rel="stylesheet" href="oblique-matching.css">
<!-- Font: resources/oblique-symmetric.ttf (Cairo's shape, slnt -11..11, no ital) — see README.md's font shape table. -->
<style>
  @font-face {
    font-family: "matrix test font";
    src: url('resources/oblique-symmetric.ttf');
  }
  .test {
    font-family: "matrix test font";
  }
</style>
<script>
  document.fonts.ready.then(() => {
    document.documentElement.classList.remove('reftest-wait');
  });
</script>

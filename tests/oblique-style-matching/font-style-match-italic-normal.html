<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<title>CSS Test: font-style: normal + font-style: italic;</title>
<!--
  @font-face font-style: normal, request "italic". The reference algorithm permits: slnt 0; synth (a synthesized 14deg skew).
  selected face face (stage: italic: oblique <= 0 descending)
  normal face: descriptor replaces the font data's style (4.4); applied value clamped to [0,0]
  synthesis permitted: the family lacks italic and oblique faces (5.2); not required (2.3 "will be generated" vs 5.2 "may create")
  font-synthesis is left at its default: a matched request must not be synthesized.
-->
<link rel="help" href="https://drafts.csswg.org/css-fonts-4/#font-style-matching">
<link rel="help" href="https://drafts.csswg.org/css-fonts-4/#font-synthesis-style">
<link rel="mismatch" href="font-style-match-slnt-11-ref.html">
<meta name="assert"
  content="A face declared 'font-style: normal', requested with 'font-style: italic;', must NOT render like any of: slnt -11.">
<link rel="stylesheet" href="font-style-match.css">
<style>
  @font-face {
    font-family: "Cairo Var OBLIQUE";
    src: url('resources/Cairo.var.subset.ttf');
    font-style: normal;
  }
  .test {
    font-family: "Cairo Var OBLIQUE";
    font-size: 8em;
  }
</style>

<p class="test" style="font-style: italic;">I</p>

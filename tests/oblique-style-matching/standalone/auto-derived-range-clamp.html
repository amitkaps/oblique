<!DOCTYPE html>
<html lang="en" class="reftest-wait">
<meta charset="utf-8" />
<title>CSS Test: bare `oblique`/`italic` default angle clamps into an AUTO-DERIVED (undeclared) `slnt` range</title>
<!--
  Algorithm step: CSS Fonts 4 §5.2 "Matching font styles" — when
  `font-style` is left at its default (`auto`) in `@font-face`, the UA must
  derive the face's usable oblique range from the variable font's own
  `slnt` axis extremes (fvar/STAT), not from an authored descriptor. A bare
  `font-style: oblique` or `font-style: italic` request (no explicit angle)
  must then resolve against THAT auto-derived range, clamping the UA's
  default angle (conventionally 14deg) to the nearest value the range
  actually supports if 14deg falls outside it.
  Prior art: this is the precise shape of Cairo's real-world bug
  (vizchitra-fonts/docs/compat.md) — Cairo ships with no `font-style`
  descriptor, so its usable range comes entirely from its own `slnt` axis
  (-11 to 11), and the default angle falls outside it. Confirmed as an
  upstream WPT gap in docs/coverage.json's `confirmed_gaps` (id
  `auto-range-default-angle`, priority 1): the closest upstream test,
  css/css-fonts/variations/font-slant-1.html, covers the identical
  default-angle-outside-range question but only for an EXPLICITLY authored
  descriptor range (and passes on Chrome/Firefox/Safari per
  results/upstream.json — see docs/coverage.json for the full citation).
  The auto-derived-range version — this test — was untested anywhere
  before this file existed.
  Pass means: bare `oblique` and bare `italic` render identically to the
  reference, which sets 'slnt' to this font's own axis extreme (-10)
  directly via font-variation-settings, bypassing automatic font-style
  matching — i.e. the UA correctly clamped the default angle into the
  font's own auto-derived range rather than ignoring the axis or
  synthesizing a skew on top of it.
-->
<link rel="help" href="https://drafts.csswg.org/css-fonts-4/#font-style-matching" />
<link rel="help" href="https://drafts.csswg.org/css-fonts-4/#font-prop-desc" />
<link rel="match" href="auto-derived-range-clamp-ref.html">
<meta name="assert"
  content="Bare 'oblique' and bare 'italic' requests against a variable-font
  face with NO explicit font-style descriptor (auto) resolve through the
  font's own fvar-derived slnt range, clamping the UA default angle to that
  range's boundary rather than ignoring the axis." />
<!--
  Font: resources/Inter.var.subset.ttf, copied verbatim from WPT's own
  css/css-fonts/variations/resources/ (already reused upstream by
  font-slant-1.html and font-face-style-auto-variable.html, both of which
  PASS on all three engines per results/upstream.json — same font, same
  provenance, no new font-building risk). Its declared fvar slnt axis is
  -10..0, confirmed via fontTools 2026-09-18 — this excludes the
  conventional 14-degree default angle on either sign, which is exactly
  the condition this gap requires. The CSS-oblique-angle-to-OpenType-slnt
  sign convention (positive CSS angle == negative slnt value for this
  font) is the same one already verified working for explicit angles by
  font-face-style-auto-variable.html (oblique 10deg -> 'slnt' -10, etc.) —
  this test extends that same, already-confirmed mapping to the bare
  keyword case.
-->
<style>
  @font-face {
    font-family: "auto range test font";
    src: url('../resources/Inter.var.subset.ttf');
    /* Deliberately no font-style descriptor: this is the "auto" case,
       matching how most variable webfonts (including Cairo) actually
       ship, per the gap this test targets. */
  }

  .test {
    font-synthesis: none;
    font-family: "auto range test font";
    font-size: 3em;
  }
</style>
<script>
  document.fonts.ready.then(() => {
    document.documentElement.classList.remove('reftest-wait');
  });
</script>

<p class="test" style="font-style: oblique">slant</p>
<p class="test" style="font-style: italic">slant</p>

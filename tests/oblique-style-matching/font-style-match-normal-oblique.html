<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<title>CSS Test: font-style: oblique + font-style: normal;</title>
<!--
  @font-face font-style: oblique, request "normal". The reference algorithm permits: slnt -11.
  selected face face (stage: normal: oblique >= 0 ascending)
  oblique face [14, 14]: closest matching value 14, clamped to the descriptor, then to the font
  font-synthesis is left at its default: a matched request must not be synthesized.
-->
<link rel="help" href="https://drafts.csswg.org/css-fonts-4/#font-style-matching">
<link rel="help" href="https://drafts.csswg.org/css-fonts-4/#font-synthesis-style">
<link rel="match" href="font-style-match-slnt-11-ref.html">
<meta name="assert"
  content="A face declared 'font-style: oblique', requested with 'font-style: normal;', must render like one of: slnt -11.">
<link rel="stylesheet" href="font-style-match.css">
<style>
  @font-face {
    font-family: "Cairo Var OBLIQUE";
    src: url('resources/Cairo.var.subset.ttf');
    font-style: oblique;
  }
  .test {
    font-family: "Cairo Var OBLIQUE";
    font-size: 8em;
  }
</style>

<p class="test" style="font-style: normal;">I</p>

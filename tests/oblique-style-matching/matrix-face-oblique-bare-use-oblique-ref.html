<!DOCTYPE html>
<html lang="en" class="reftest-wait">
<meta charset="utf-8" />
<title>CSS Test: @font-face { font-style: oblique } + font-style: oblique (bare) (reference)</title>
<!--
  Reference: the same face with 'slnt' set directly to -11.
-->
<link rel="stylesheet" href="oblique-matching.css">
<style>
  @font-face {
    font-family: "matrix test font";
    src: url('resources/Cairo.var.subset.ttf');
    font-style: oblique;
  }
  .test {
    font-family: "matrix test font";
    font-size: 8em;
    font-variation-settings: 'slnt' -11;
  }
</style>
<script>
  document.fonts.ready.then(() => {
    document.documentElement.classList.remove('reftest-wait');
  });
</script>

<p class="test">I</p>

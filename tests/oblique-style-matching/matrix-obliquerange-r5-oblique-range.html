<!DOCTYPE html>
<html lang="en" class="reftest-wait">
<meta charset="utf-8" />
<title>CSS Test: font-style: oblique -11deg 11deg (explicit, matching true bounds) + <em> (implicit italic via the UA stylesheet), font-synthesis: none</title>
<!--
  Coverage-matrix cell: @font-face descriptor = "font-style: oblique -11deg 11deg (explicit, matching true bounds)", use-site CSS
  = "<em> (implicit italic via the UA stylesheet), font-synthesis: none". Part of a systematic 5-descriptor x 7-use-site
  enumeration built for this folder's font-shape x use-site coverage matrix
  (see ../../scripts/generate-site-data.py's MATRIX_FONT_SHAPES /
  MATRIX_USE_SITE_COLUMNS, and docs/investigation-log.md for the full
  session this batch was built in).
  em implies italic; with synthesis explicitly off, the explicit-range descriptor's real axis is set directly with no risk of the synthesis-stacking bug (that bug requires synthesis to be allowed).
-->
<link rel="help" href="https://drafts.csswg.org/css-fonts-4/#font-style-matching" />
<link rel="help" href="https://drafts.csswg.org/css-fonts-4/#descdef-font-face-font-style" />
<link rel="match" href="matrix-obliquerange-r5-oblique-range-ref.html">
<meta name="assert"
  content="A face declared 'font-style: oblique -11deg 11deg (explicit, matching true bounds)', requested with '<em> (implicit italic via the UA stylesheet), font-synthesis: none',
  must render the same as the reference, which sets 'slnt' -11 directly." />
<link rel="stylesheet" href="oblique-matching.css">
<!-- Font: resources/oblique-symmetric.ttf (Cairo's shape, slnt -11..11, no ital) — see README.md's font shape table. -->
<style>
  @font-face {
    font-family: "matrix test font";
    src: url('resources/oblique-symmetric.ttf');
    font-style: oblique -11deg 11deg;
  }
  .test {
    font-family: "matrix test font";
  }
</style>
<script>
  document.fonts.ready.then(() => {
    document.documentElement.classList.remove('reftest-wait');
  });
</script>

<p class="test" style="font-synthesis: none"><em>A</em></p>

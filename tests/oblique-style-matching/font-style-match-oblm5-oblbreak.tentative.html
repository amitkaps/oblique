<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<title>CSS Test: font-style: oblique -14deg 14deg + font-style: oblique -5deg;</title>
<!--
  @font-face font-style: oblique -14deg 14deg, request "oblique -5deg". The reference algorithm permits: slnt 5.
  selected face face (stage: oblique -5: faces containing the angle)
  oblique face [-14, 14]: closest matching value -5, clamped to the descriptor, then to the font
  no synthesis: an oblique face exists (2.3)
  Assumption: negative-angle: spec says only 'negated values and opposite directions'
  font-synthesis is left at its default: a matched request must not be synthesized.
-->
<link rel="help" href="https://drafts.csswg.org/css-fonts-4/#font-style-matching">
<link rel="help" href="https://drafts.csswg.org/css-fonts-4/#font-synthesis-style">
<link rel="match" href="font-style-match-slnt5-ref.html">
<meta name="assert"
  content="A face declared 'font-style: oblique -14deg 14deg', requested with 'font-style: oblique -5deg;', must render like one of: slnt 5.">
<link rel="stylesheet" href="font-style-match.css">
<style>
  @font-face {
    font-family: "Cairo Var OBLIQUE";
    src: url('resources/Cairo.var.subset.ttf');
    font-style: oblique -14deg 14deg;
  }
  .test {
    font-family: "Cairo Var OBLIQUE";
    font-size: 8em;
  }
</style>

<p class="test" style="font-style: oblique -5deg;">I</p>

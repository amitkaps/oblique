<!DOCTYPE html>
<html lang="en" class="reftest-wait">
<meta charset="utf-8" />
<title>CSS Test: `oblique` does not activate a variable font's `ital` axis (reference)</title>
<!--
  Reference rendering: font-style: normal against the same face — the
  known-good "ital axis left at its default (0)" rendering, with no
  font-style matching of any kind involved. If font-style: oblique against
  this ital-only face renders identically to this, the ital axis was never
  touched by the oblique request.
-->
<style>
  @font-face {
    font-family: "ital axis test";
    src: url('resources/IdentTestItal.ttf');
  }

  .test {
    font-family: "ital axis test";
    font-size: 3em;
  }
</style>
<script>
  document.fonts.ready.then(() => {
    document.documentElement.classList.remove('reftest-wait');
  });
</script>

<p class="test">A</p>

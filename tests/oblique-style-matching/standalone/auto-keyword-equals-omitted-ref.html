<!DOCTYPE html>
<html lang="en" class="reftest-wait">
<meta charset="utf-8" />
<title>Reference: the font-style descriptor omitted</title>
<link rel="stylesheet" href="../oblique-matching.css">
<style>
  @font-face {
    font-family: "auto omitted face";
    src: url('../resources/Cairo.var.subset.ttf');
  }
  .test {
    font-family: "auto omitted face";
    font-size: 4em;
    display: inline-block;
    margin: 0 0.3em;
  }
</style>
<script>
  document.fonts.ready.then(() => {
    document.documentElement.classList.remove('reftest-wait');
  });
</script>

<p class="test" style="font-style: normal">I</p>
<p class="test" style="font-style: italic">I</p>
<p class="test" style="font-style: oblique">I</p>
<p class="test" style="font-style: oblique 5deg">I</p>
<p class="test" style="font-style: oblique 45deg">I</p>
<p class="test" style="font-style: oblique -5deg">I</p>
<p class="test"><em>I</em></p>

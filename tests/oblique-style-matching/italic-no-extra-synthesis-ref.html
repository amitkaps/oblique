<!DOCTYPE html>
<html lang="en" class="reftest-wait">
<meta charset="utf-8" />
<title>CSS Test: `italic` against a variable `ital` axis face must not stack synthetic slant on top (reference)</title>
<!--
  Reference rendering: sets the ital axis explicitly via
  font-variation-settings, bypassing font-style matching (and therefore any
  synthesis decision) entirely — the "real axis, nothing extra" ground
  truth this font's ital=1 shear should look like.
-->
<style>
  @font-face {
    font-family: "ital axis test";
    src: url('resources/IdentTestItal.ttf');
  }

  .test {
    font-family: "ital axis test";
    font-size: 3em;
  }

  .ital1 {
    font-variation-settings: 'ital' 1;
  }
</style>
<script>
  document.fonts.ready.then(() => {
    document.documentElement.classList.remove('reftest-wait');
  });
</script>

<p class="test ital1">A</p>

<!DOCTYPE html>
<html lang="en">
<meta charset="utf-8">
<title>CSS Test: no font-style descriptor (auto) + font-style: normal;</title>
<!--
  @font-face no font-style descriptor (auto), request "normal". The reference algorithm permits: slnt 0.
  selected face face (stage: normal: oblique >= 0 ascending)
  auto face, normal request: selected as normal, applied value 0
  font-synthesis is left at its default: a matched request must not be synthesized.
-->
<link rel="help" href="https://drafts.csswg.org/css-fonts-4/#font-style-matching">
<link rel="help" href="https://drafts.csswg.org/css-fonts-4/#font-synthesis-style">
<link rel="match" href="font-style-match-slnt0-ref.html">
<meta name="assert"
  content="A face with no font-style descriptor (auto), requested with 'font-style: normal;', must render like one of: slnt 0.">
<link rel="stylesheet" href="font-style-match.css">
<style>
  @font-face {
    font-family: "Cairo Var OBLIQUE";
    src: url('resources/Cairo.var.subset.ttf');
  }
  .test {
    font-family: "Cairo Var OBLIQUE";
    font-size: 8em;
  }
</style>

<p class="test" style="font-style: normal;">I</p>

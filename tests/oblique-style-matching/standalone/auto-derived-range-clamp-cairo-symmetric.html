<!DOCTYPE html>
<html lang="en" class="reftest-wait">
<meta charset="utf-8" />
<title>CSS Test: bare `oblique`/`italic` default angle clamps into an AUTO-DERIVED range matching Cairo's exact (-11..11) shape</title>
<!--
  Algorithm step: same as auto-derived-range-clamp.html — CSS Fonts 4 §5.2
  "Matching font styles": a bare `font-style: oblique`/`italic` request
  against a face with NO explicit `font-style` descriptor must resolve
  through the face's fvar-derived `slnt` range, clamping the UA default
  angle (14deg) to the range's boundary if it falls outside.
  Why this is a SEPARATE test from auto-derived-range-clamp.html: that test
  uses Inter.var.subset.ttf (WPT's own corpus font), whose actual slnt
  range is -10..0 — one-sided, and narrower than Cairo's. It PASSED on
  Chrome and Firefox, but the gap analysis for
  `auto-range-default-angle` was explicit that a one-sided-range PASS does
  not independently re-confirm or refute Cairo's own real-world bug
  (vizchitra-fonts/docs/compat.md), because Cairo's range is a different
  shape: symmetric, -11 to 11.
  This test closes exactly that follow-up: resources/Cairo.var.subset.ttf
  (Cairo itself, subset to the letters of "OBLIQUE") has a real fvar slnt
  range of -11..11 — verified via fontTools — which IS Cairo's range, still excluding the 14deg default angle on
  either sign. If this test's result ever diverges from
  auto-derived-range-clamp.html's (e.g. PASS there but FAIL here), that
  divergence would itself be evidence that the one-sided/symmetric range
  shape matters, not just whether the default angle falls outside the
  range.
  Pass means: bare `oblique` and bare `italic` render identically to the
  reference, which sets 'slnt' to this font's own negative axis extreme
  (-11) directly via font-variation-settings, bypassing automatic
  font-style matching — i.e. the UA correctly clamped the default angle
  (positive, so slnt should move negative per this project's established
  sign convention) into the font's own auto-derived range.
-->
<link rel="help" href="https://drafts.csswg.org/css-fonts-4/#font-style-matching" />
<link rel="help" href="https://drafts.csswg.org/css-fonts-4/#font-prop-desc" />
<link rel="match" href="auto-derived-range-clamp-cairo-symmetric-ref.html">
<meta name="assert"
  content="Bare 'oblique' and bare 'italic' requests against a variable-font
  face with NO explicit font-style descriptor (auto), whose fvar slnt range
  is a symmetric -11..11 (matching Cairo's real-world range exactly),
  resolve through that auto-derived range, clamping the UA default angle to
  the range's boundary rather than ignoring the axis." />
<!--
  Font: resources/Cairo.var.subset.ttf, rebuilt by
  resources/build-cairo-subset.sh: real Cairo (SIL OFL, no Reserved Font
  Name) cut down to the glyphs of "OBLIQUE", keeping both axes (wght
  200..1000, slnt -11..11, default 0) and the layout/variation tables,
  the same way WPT's own Inter.var.subset.ttf is a subset of real Inter.
  Sign convention (established by this project): a positive CSS oblique
  angle maps to a NEGATIVE slnt value, so the 14deg UA default clamps to
  slnt -11 (this font's minimum), not +11.
  Test glyph: the capital I, a plain 4-point stem, so the lean is
  unmistakable. The cmap only holds O B L I Q U E: any other text would
  silently fall back to a system font instead of failing loudly (this
  test's first draft, against a one-glyph font, "failed" both engines
  that way, caught via pixel-diff forensics). The test originally used a
  purpose-built block font; it was migrated to real Cairo with no result
  changing.
-->
<style>
  @font-face {
    font-family: "auto range cairo-symmetric test font";
    src: url('../resources/Cairo.var.subset.ttf');
    /* Deliberately no font-style descriptor: the auto-derived-range case,
       matching how Cairo itself ships (vizchitra-fonts/docs/compat.md). */
  }

  .test {
    font-synthesis: none;
    font-family: "auto range cairo-symmetric test font";
    font-size: 8em;
  }
</style>
<script>
  document.fonts.ready.then(() => {
    document.documentElement.classList.remove('reftest-wait');
  });
</script>

<p class="test" style="font-style: oblique">I</p>
<p class="test" style="font-style: italic">I</p>

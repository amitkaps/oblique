<!DOCTYPE html>
<html lang="en" class="reftest-wait">
<meta charset="utf-8" />
<title>CSS Test: font-style: normal + bare font-style: italic, default synthesis (must NOT match a real-axis rendering)</title>
<!--
  Coverage-matrix cell: @font-face descriptor = "font-style: normal", use-site CSS
  = "bare font-style: italic, default synthesis". Part of a systematic 5-descriptor x 7-use-site
  enumeration built for this folder's font-shape x use-site coverage matrix
  (see ../../scripts/generate-site-data.py's MATRIX_FONT_SHAPES /
  MATRIX_USE_SITE_COLUMNS, and docs/investigation-log.md for the full
  session this batch was built in).
  Family lacks an italic/oblique face (this one is declared normal) — CSS Fonts 4 2.8.2 permits synthesis here. Measured: shear present (~16px) on both engines, not pinned to an exact value since synthetic-skew geometry is engine-defined — asserted as mismatch-vs-upright only.
-->
<link rel="help" href="https://drafts.csswg.org/css-fonts-4/#font-style-matching" />
<link rel="help" href="https://drafts.csswg.org/css-fonts-4/#descdef-font-face-font-style" />
<link rel="mismatch" href="matrix-normal-r1-normal-ref.html">
<meta name="assert"
  content="A face declared 'font-style: normal', requested with 'bare font-style: italic, default synthesis',
  must NOT render the same as the reference (this same face's default, untouched rendering — upright)." />
<link rel="stylesheet" href="oblique-matching.css">
<!-- Font: resources/oblique-symmetric.ttf (Cairo's shape, slnt -11..11, no ital) — see README.md's font shape table. -->
<style>
  @font-face {
    font-family: "matrix test font";
    src: url('resources/oblique-symmetric.ttf');
    font-style: normal;
  }
  .test {
    font-family: "matrix test font";
  }
</style>
<script>
  document.fonts.ready.then(() => {
    document.documentElement.classList.remove('reftest-wait');
  });
</script>

<p class="test" style="font-style: italic;">A</p>

<!DOCTYPE html>
<html lang="en" class="reftest-wait">
<meta charset="utf-8" />
<title>CSS Test: bare `oblique`/`italic` default angle clamps into an AUTO-DERIVED range matching Cairo's exact (-11..11) shape (reference)</title>
<!--
  Reference rendering: sets the slnt axis explicitly via
  font-variation-settings to this font's own negative extreme (-11, its
  fvar minimum), bypassing automatic font-style matching entirely — the
  "known good" rendering the test's automatic-mapping path is checked
  against. Both bare 'oblique' and bare 'italic' are expected to clamp to
  this same boundary, since the font's auto-derived usable range (0..11 in
  CSS-angle terms) doesn't reach the UA's 14-degree default, and the face
  exposes no real 'ital' axis for 'italic' to resolve through separately.
-->
<style>
  @font-face {
    font-family: "auto range cairo-symmetric test font";
    src: url('resources/Cairo.var.subset.ttf');
  }

  .test {
    font-family: "auto range cairo-symmetric test font";
    font-size: 8em;
    font-variation-settings: 'slnt' -11;
  }
</style>
<script>
  document.fonts.ready.then(() => {
    document.documentElement.classList.remove('reftest-wait');
  });
</script>

<p class="test">I</p>
<p class="test">I</p>

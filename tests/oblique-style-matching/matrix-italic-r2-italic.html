<!DOCTYPE html>
<html lang="en" class="reftest-wait">
<meta charset="utf-8" />
<title>CSS Test: font-style: italic (bare, binary) + bare font-style: oblique, default synthesis</title>
<!--
  Coverage-matrix cell: @font-face descriptor = "font-style: italic (bare, binary)", use-site CSS
  = "bare font-style: oblique, default synthesis". Part of a systematic 5-descriptor x 7-use-site
  enumeration built for this folder's font-shape x use-site coverage matrix
  (see ../../scripts/generate-site-data.py's MATRIX_FONT_SHAPES /
  MATRIX_USE_SITE_COLUMNS, and docs/investigation-log.md for the full
  session this batch was built in).
  An oblique request falls through to match this face via the italic branch's own oblique>=11 search's italic-fallback stage; measured 18px shear (matches real-axis baseline) on both engines — no divergence here, unlike the italic-keyword case (see italic-no-extra-synthesis.html).
-->
<link rel="help" href="https://drafts.csswg.org/css-fonts-4/#font-style-matching" />
<link rel="help" href="https://drafts.csswg.org/css-fonts-4/#descdef-font-face-font-style" />
<link rel="match" href="matrix-italic-r2-italic-ref.html">
<meta name="assert"
  content="A face declared 'font-style: italic (bare, binary)', requested with 'bare font-style: oblique, default synthesis',
  must render the same as the reference, which sets 'slnt' -11 directly." />
<link rel="stylesheet" href="oblique-matching.css">
<!-- Font: resources/oblique-symmetric.ttf (Cairo's shape, slnt -11..11, no ital) — see README.md's font shape table. -->
<style>
  @font-face {
    font-family: "matrix test font";
    src: url('resources/oblique-symmetric.ttf');
    font-style: italic;
  }
  .test {
    font-family: "matrix test font";
  }
</style>
<script>
  document.fonts.ready.then(() => {
    document.documentElement.classList.remove('reftest-wait');
  });
</script>

<p class="test" style="font-style: oblique;">A</p>

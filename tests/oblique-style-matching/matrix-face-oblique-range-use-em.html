<!DOCTYPE html>
<html lang="en" class="reftest-wait">
<meta charset="utf-8" />
<title>CSS Test: @font-face { font-style: oblique -11deg 11deg } + <em> (implicit italic from the UA stylesheet)</title>
<!--
  Coverage-matrix cell: column = "@font-face { font-style: oblique -11deg 11deg }", row = "<em> (implicit italic from the UA stylesheet)".
  One of 30 cells (5 @font-face descriptors x 6 use-site patterns) built
  for this folder's coverage matrix; see resources/gen-matrix.py for how
  each expected value was derived and docs/investigation-log.md section 10.
  font-synthesis is deliberately left at its default: the spec synthesizes
  only when the family lacks a suitable face, so a matched request must
  never synthesize, and forcing it off would hide a browser that does.
  <em> is implicit italic, so the same as the italic row. Chrome stacks a synthetic skew on top.
-->
<link rel="help" href="https://drafts.csswg.org/css-fonts-4/#font-style-matching" />
<link rel="help" href="https://drafts.csswg.org/css-fonts-4/#descdef-font-face-font-style" />
<link rel="help" href="https://drafts.csswg.org/css-fonts-4/#font-synthesis-style" />
<link rel="match" href="matrix-face-oblique-range-use-em-ref.html">
<meta name="assert"
  content="A face declared '@font-face { font-style: oblique -11deg 11deg }', requested with '<em> (implicit italic from the UA stylesheet)',
  must render the same as the reference, which sets 'slnt' -11 directly." />
<link rel="stylesheet" href="oblique-matching.css">
<!-- Font: resources/Cairo.var.subset.ttf: real Cairo subset (slnt -11..11, wght 200..1000, no ital); the test glyph is the capital I, a plain stem. -->
<style>
  @font-face {
    font-family: "matrix test font";
    src: url('resources/Cairo.var.subset.ttf');
    font-style: oblique -11deg 11deg;
  }
  .test {
    font-family: "matrix test font";
    font-size: 8em;
  }
</style>
<script>
  document.fonts.ready.then(() => {
    document.documentElement.classList.remove('reftest-wait');
  });
</script>

<p class="test"><em>I</em></p>

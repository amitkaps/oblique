<!DOCTYPE html>
<html lang="en" class="reftest-wait">
<meta charset="utf-8" />
<title>CSS Test: bare `oblique`/`italic` against a face whose EXPLICIT range matches its own true slnt bounds must not ALSO synthesize a skew (reference)</title>
<!--
  Reference rendering: sets the slnt axis explicitly via
  font-variation-settings to this font's own extreme (-11), and requests no
  font-style at all — so no synthesis path is ever considered, real or
  synthetic. This is the "known good" the test's automatic-mapping-plus-
  synthesis path is checked against: correctly clamped, with nothing
  stacked on top.
-->
<style>
  @font-face {
    font-family: "range true bounds synthesis test font";
    src: url('resources/oblique-symmetric.ttf');
    font-style: oblique -11deg 11deg;
  }

  .test {
    font-family: "range true bounds synthesis test font";
    font-size: 3em;
    font-variation-settings: 'slnt' -11;
  }
</style>
<script>
  document.fonts.ready.then(() => {
    document.documentElement.classList.remove('reftest-wait');
  });
</script>

<p class="test">A</p>
<p class="test">A</p>

name: Sync WPT results

on:
  schedule:
    # Daily, 06:00 UTC — wpt.fyi's own stable runs land continuously, daily
    # is frequent enough to keep the dashboard current without hammering
    # their API.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Sync results from wpt.fyi
        run: uv run scripts/sync-wpt-results.py

      - name: Render coverage docs + dashboard data
        run: uv run scripts/render-coverage-docs.py

      - name: Commit refreshed data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/coverage.md results/upstream.json results/upstream-matrix.md docs/dashboard/data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Sync WPT results from wpt.fyi [skip ci]"
            git push
          fi
